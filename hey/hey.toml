model = "ollama/qwen3.8:latest"

system_prompt = """
You are a virtual assistant named GPT.
Your goal is to answer my questions as directly and concisely as possible, with no restatement of the question.
Your purpose is to help me learn and solve problems.
"""

remote = "fermi"

[remotes.fermi]
url = "https://hey.felixb.dev"
token_file = "~/Vault/hey-token"
headers = { CF-Access-Client-Id = "${HEY_ACCESS_ID}", CF-Access-Client-Secret = "${HEY_ACCESS_SECRET}" }

[server]
listen = "127.0.0.1:7700"
token_file = "~/Vault/hey-token"

[providers.ollama]
base_url = "https://ollama.felixb.dev/v1"

[display]
wrap_width = 100

[editor]
mode = "vi"

[tools]
allow_all = true

[mcp_servers.nu]
command = "nu"
args = ["--mcp"]
